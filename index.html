<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Homestead HQ · Cloud Connection Test</title><style>body{background:#101716;color:#eef2eb;font:16px system-ui;max-width:680px;margin:70px auto;padding:20px}button{background:#c7ddab;color:#101716;border:0;border-radius:9px;padding:13px 18px;font-weight:bold;cursor:pointer;margin:5px}#status{padding:18px;border:1px solid #526354;border-radius:10px;white-space:pre-wrap}small{color:#b7c7bd}</style></head><body><h1>Hill Country Homestead HQ</h1><p>Step 1: Verify private Firestore access before we move your property dashboard online.</p><div id="status">Checking Google sign-in…</div><p><button id="login">Sign in with Google</button><button id="test" disabled>Test cloud save + read</button><button id="logout" disabled>Sign out</button></p><small>This test writes only a harmless test message to your private Firestore account. It does not upload or change your 44 properties.</small><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,doc,setDoc,getDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const app=initializeApp({apiKey:'AIzaSyBCHC3qCtpt9EG1V6aKEEyKRcZflzRCUXo',authDomain:'hill-country-homestead-hq.firebaseapp.com',projectId:'hill-country-homestead-hq',storageBucket:'hill-country-homestead-hq.firebasestorage.app',messagingSenderId:'548679088041',appId:'1:548679088041:web:66cad907aa709fae2136b8'});
const auth=getAuth(app),db=getFirestore(app),status=document.getElementById('status'),test=document.getElementById('test'),login=document.getElementById('login'),logout=document.getElementById('logout');
const report=x=>status.textContent=x;
onAuthStateChanged(auth,user=>{login.disabled=!!user;test.disabled=!user;logout.disabled=!user;report(user?'Signed in as '+user.email+'\nReady to test Firestore.':'Not signed in. Click Sign in with Google.');});
login.onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){report('Sign-in error: '+e.code+'\n'+e.message)}};
logout.onclick=async()=>{try{await signOut(auth)}catch(e){report('Sign-out error: '+e.message)}};
test.onclick=async()=>{const user=auth.currentUser;if(!user)return;test.disabled=true;report('Testing secure write and read…');try{const ref=doc(db,'users',user.uid,'system','connection-test');const message='Cloud connection successful · '+new Date().toISOString();await setDoc(ref,{message,updatedAt:serverTimestamp()});const result=await getDoc(ref);if(result.exists()&&result.data().message===message){report('SUCCESS! ✅\nFirestore write: passed\nFirestore read: passed\nGoogle account: '+user.email+'\n\nTell Val: “Cloud test passed.”')}else{report('Write completed but read verification failed.')}}catch(e){report('Cloud test failed: '+e.code+'\n'+e.message+'\n\nTell Val the exact error shown here.')}finally{test.disabled=false}};
</script></body></html>
